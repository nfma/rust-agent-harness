name: Security

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-secrets:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned Gitleaks
        run: |
          ./scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Run Semgrep community security rules
        run: >-
          uvx --from semgrep==1.173.0 semgrep scan
          --config p/default
          --config p/security-audit
          --error
          --metrics=off
          --exclude target
          .

      - name: Scan Git history for secrets
        run: gitleaks git --redact --verbose .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Scan dependencies, configuration, and secrets
        run: >-
          trivy fs
          --scanners vuln,misconfig,secret
          --severity MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs target
          .
