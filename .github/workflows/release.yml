name: Build and release

on:
  pull_request:
  push:
    branches:
      - trunk
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET" -p harness-cli
        env:
          TARGET: ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          manifest_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "harness-cli"))')"
          release_version="$manifest_version"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"

            if [[ "$release_version" != "$manifest_version" ]]; then
              echo "Tag version $release_version does not match Cargo version $manifest_version" >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/trunk; then
              echo "Release tag must point to a commit on trunk" >&2
              exit 1
            fi
          fi

          archive_stem="harness-${release_version}-${TARGET}"
          package_directory="dist/${archive_stem}"
          mkdir -p "$package_directory"
          cp "target/${TARGET}/release/harness" LICENSE README.md "$package_directory/"
          tar -czf "dist/${archive_stem}.tar.gz" -C dist "$archive_stem"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
